<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Registro Mangas GD</title>
<meta name="description" content="Registro de trabajo de corral con ganado" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#1C1815" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mangas GD" />

<style>
  html, body { margin: 0; padding: 0; background: #1C1815; }
  #root { min-height: 100vh; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root">
  <div style="color:#A9998A;font-family:sans-serif;text-align:center;padding:40px 16px;">Cargando…</div>
</div>

<script>
  // Base compartida (Firestore): acá se guardan y sincronizan los registros entre aparatos.
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyDXyYm_2Vc24JyYJNPHzOavl0JxAT16Srs",
      authDomain: "registros-mangas-gd.firebaseapp.com",
      projectId: "registros-mangas-gd",
      storageBucket: "registros-mangas-gd.firebasestorage.app",
      messagingSenderId: "479476444841",
      appId: "1:479476444841:web:a31f8573b337e183afc3b8"
    });
    window.db = firebase.firestore();
    // Ayuda a que la conexión ande mejor en internet lenta, inestable o restringida
    // (rural, celular): va directo a long-polling en vez de perder tiempo probando
    // WebSockets primero.
    window.db.settings({ experimentalForceLongPolling: true });
  } catch (e) {
    // Si Firebase no llegó a cargar (por ejemplo sin conexión), seguimos sin cortar
    // la página: la app arranca igual y muestra su propio aviso de "sin conexión".
    window.db = undefined;
  }

  // La librería para generar el Excel es pesada, así que no se carga hasta que
  // realmente se necesita (al tocar "Descargar Excel"), para que la app abra rápido.
  window.cargarXLSX = function () {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('no se pudo cargar el componente de Excel')); };
      document.head.appendChild(s);
    });
  };

  // El tema (claro/oscuro) es una preferencia de cada aparato, no se comparte:
  // se guarda en localStorage del navegador, no en la base compartida.
  (function () {
    var PREFIX = 'rmgd:';
    window.storage = {
      get: function (key, shared) {
        return Promise.resolve().then(function () {
          var raw = window.localStorage.getItem(PREFIX + key);
          return raw !== null ? { key: key, value: raw, shared: !!shared } : null;
        });
      },
      set: function (key, value, shared) {
        return Promise.resolve().then(function () {
          window.localStorage.setItem(PREFIX + key, value);
          return { key: key, value: value, shared: !!shared };
        });
      },
      delete: function (key, shared) {
        return Promise.resolve().then(function () {
          window.localStorage.removeItem(PREFIX + key);
          return { key: key, deleted: true, shared: !!shared };
        });
      },
      list: function (prefix, shared) {
        return Promise.resolve().then(function () {
          var keys = Object.keys(window.localStorage)
            .filter(function (k) { return k.indexOf(PREFIX) === 0; })
            .map(function (k) { return k.slice(PREFIX.length); })
            .filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
          return { keys: keys, prefix: prefix, shared: !!shared };
        });
      },
    };
  })();
</script>

<script src="app.js?v=11"></script>
</body>
</html>
