<style>
  html, body { margin: 0; padding: 0; background: #1C1815; }

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<body>
<div id="root">
  <div style="color:#A9998A;font-family:sans-serif;text-align:center;padding:40px 16px;">Cargando…</div>
</div>

<script>
  // Reemplazo de la API de almacenamiento de Claude usando localStorage del navegador,
  // ya que acá corre como sitio independiente.
  (function () {
    var PREFIX = 'rmgd:';
    window.storage = {
      get: function (key, shared) {
        return Promise.resolve().then(function () {
          var raw = window.localStorage.getItem(PREFIX + key);
          return raw !== null ? { key: key, value: raw, shared: !!shared } : null;
        });
      },
      set: function (key, value, shared) {
        return Promise.resolve().then(function () {
          window.localStorage.setItem(PREFIX + key, value);
          return { key: key, value: value, shared: !!shared };
        });
      },
      delete: function (key, shared) {
        return Promise.resolve().then(function () {
          window.localStorage.removeItem(PREFIX + key);
          return { key: key, deleted: true, shared: !!shared };
        });
      },
      list: function (prefix, shared) {
        return Promise.resolve().then(function () {
          var keys = Object.keys(window.localStorage)
            .filter(function (k) { return k.indexOf(PREFIX) === 0; })
            .map(function (k) { return k.slice(PREFIX.length); })
            .filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
          return { keys: keys, prefix: prefix, shared: !!shared };
        });
      },
    };
  })();
</script>

<script src="app.js?v=3"></script>
</body>
</html>
